name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include exact steps and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Waterfall Studio version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
    validations:
      required: true
  - type: textarea
    id: station
    attributes:
      label: Relevant radio/audio setup
      description: Radio, interface, mode, filter width, and PTT method. Omit private identifiers.
  - type: textarea
    id: logs
    attributes:
      label: Error text or screenshots
      description: Drag files here; remove personal information first.
