[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "waterfall-studio"
version = "0.3.0"
description = "Create channel-aware waterfall text and artwork as multitone audio"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Waterfall Studio contributors"}]
keywords = ["amateur-radio", "ham-radio", "waterfall", "sdr", "audio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Ham Radio",
]
dependencies = [
  "PySide6>=6.7",
  "numpy>=2.0",
  "Pillow>=10.0",
  "sounddevice>=0.5",
  "pyserial>=3.5",
]

[project.urls]
Documentation = "https://github.com/chicodog530/Waterfall-Studio/tree/main/docs"
Issues = "https://github.com/chicodog530/Waterfall-Studio/issues"

[project.scripts]
waterfall-studio = "waterfall_studio:main"

[tool.setuptools]
py-modules = [
  "waterfall_studio",
  "ui",
  "dsp",
  "image_processing",
  "radio",
  "constants",
]
